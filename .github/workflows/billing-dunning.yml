name: Billing dunning

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: swatchwell-billing-dunning
  cancel-in-progress: false

jobs:
  send-reminders-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify billing scheduler secret
        env:
          BILLING_CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
        run: |
          if [ -z "$BILLING_CRON_SECRET" ]; then
            echo "::error::Configure the BILLING_CRON_SECRET repository secret before enabling billing automation."
            exit 1
          fi

      - name: Invoke Supabase billing dunning
        env:
          BILLING_CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $BILLING_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://uafuoobiouxscsqkkcep.supabase.co/functions/v1/billing-dunning"
